[package]
name = "lectura-rapida"
version = "1.0.0"
description = "Entrenador local de lectura rápida (RSVP, tests de comprensión y gimnasio visual)"
authors = ["Lectura Rápida"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lectura_rapida_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
